name: Refresh profile cards

on:
  schedule:
    - cron: "41 4 * * *"   # every day, 04:41 UTC
  workflow_dispatch:       # adds a "Run workflow" button
  push:
    paths: ["scripts/**", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/build.py
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "Refresh profile cards"
          git push
